appId: com.umber.app
productName: Umber
copyright: Copyright © Umber contributors

directories:
    output: release
    buildResources: build

# Everything the app needs is bundled into out/ by electron-vite, so no
# node_modules tree is shipped.
files:
    - out/**
    - package.json

asar: true

mac:
    target: dmg
    category: public.app-category.productivity

win:
    target: nsis

linux:
    target: AppImage
    category: Utility
