appId: com.umber.app
productName: Umber
copyright: Copyright © Umber contributors

directories:
    output: release
    buildResources: build

# electron-vite bundles our code into out/. electron-builder also includes
# production dependencies, including electron-updater and its dependencies.
files:
    - out/**
    - package.json

asar: true

# Keep architectures distinct in release assets and update manifests.
artifactName: ${productName}-${version}-${arch}.${ext}

# Releases are published to the public repo, which is where the app's update
# check looks. `--publish always` in the release workflow uploads the
# installers and the `latest*.yml` manifests alongside them.
publish:
    provider: github
    owner: SiebeBaree
    repo: umber

mac:
    target: [dmg, zip]
    category: public.app-category.productivity
    # Signed with the Developer ID Application certificate the release workflow
    # feeds in through CSC_LINK, then sent to Apple to be notarized. Both halves
    # are needed: a signed build that was never notarized is still stopped on
    # first launch. Notarization adds a few minutes per architecture.
    #
    # Nothing else is configured because the defaults are already right:
    # hardenedRuntime is on, and electron-builder's stock entitlements carry the
    # three keys Electron needs (allow-jit, allow-unsigned-executable-memory,
    # disable-library-validation). A build/entitlements.mac.plist would override
    # them wholesale, so it is deliberately absent.
    notarize: true
    # The DMG is for first installs; Squirrel.Mac applies updates from the ZIP.

win:
    target: nsis

linux:
    target: AppImage
    category: Utility
    # Required, not cosmetic. Without it electron-builder derives the binary
    # name from package.json's `name`, which here is the scoped `@umber/desktop`
    # and sanitizes to `@umberdesktop`. AppImage rejects the `@` as unsafe in a
    # file path and the build fails. macOS and Windows never hit this because
    # they name the binary after `productName` instead.
    executableName: umber
