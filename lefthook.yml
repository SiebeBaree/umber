# Git hooks. Installed automatically by the root `prepare` script on
# `pnpm install`; run manually with `pnpm exec lefthook run pre-commit`.
# Both tools are the same ones `pnpm check` and CI run, scoped to staged files.
pre-commit:
    parallel: true
    jobs:
        - name: format
          glob: '*.{ts,tsx,js,jsx,json,jsonc,css,md,yml,yaml}'
          run: pnpm exec oxfmt {staged_files}
          stage_fixed: true

        - name: lint
          glob: '*.{ts,tsx,js,jsx}'
          run: pnpm exec oxlint --deny-warnings {staged_files}
